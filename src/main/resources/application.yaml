spring:
  application:
    name: novus-api-router
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB:novus_api_router}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none
    chat:
      client:
        enabled: false

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.novusapirouter.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

novus:
  router:
    stream-time-out-millis: 120000
    max-active-keys-per-user: 200
    default-max-completion-tokens: 4096
    prefix-length-chars: 1024
    session-affinity-ttl-seconds: 3600
    prefix-routing-ttl-seconds: 300
    channels:
      qwen-01:
        base-url: ${QWEN_BASE_URL:https://maas.qianwenaiapi.com/compatible-mode/v1}
        api-key: ${QWEN_API_KEY_1}
      deepseek-01:
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        api-key: ${DEEPSEEK_API_KEY_1}
    model-aliases:
      "[qwen3.8-flash]":
        input-price-per-million: 0.8
        cached-input-price-per-million: 0.1
        output-price-per-million: 2.7
        routes:
          - id : 1
            channel: qwen-01
            upstream-model: qwen3.8-flash
      deepseek-flash:
        input-price-per-million: 1
        cached-input-price-per-million: 0.02
        output-price-per-million: 4
        routes:
          - id : 2
            channel: deepseek-01
            upstream-model: deepseek-flash
          - id: 3
            channel: qwen-01
            upstream-model: deepseek-v4.1-flash

  jwt:
    secret: ${JWT_SECRET}
    expire-hours: 24

  wallet:
    admin-user-ids: ${ADMIN_USER_IDS:}




