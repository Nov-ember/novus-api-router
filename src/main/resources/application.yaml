spring:
  application:
    name: novus-api-router
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:novus_api_router}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none
    chat:
      client:
        enabled: false

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.novusapirouter.model.entity
  configuration:
    map-underscore-to-camel-case: true

novus:
  router:
    access-key: ${ROUTER_ACCESS_KEY}
    stream-time-out-millis: 120000
    channels:
      qwen-01:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${QWEN_API_KEY}
      deepseek-01:
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY}
    model-aliases:
      "[qwen3.8-flash]":
        channel: qwen-01
        upstream-model: qwen3.8-flash
      deepseek-flash:
        channel: deepseek-01
        upstream-model: deepseek-flash




